<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#1E4D2B"/>
  <!-- Outer gold border -->
  <rect x="5" y="5" width="90" height="90" rx="8" fill="none" stroke="#D4AF37" stroke-width="2.5"/>
  <!-- Inner gold border -->
  <rect x="10" y="10" width="80" height="80" rx="5" fill="none" stroke="#D4AF37" stroke-width="0.8" opacity="0.65"/>
  <!-- 築 character -->
  <text x="50" y="70"
        font-family="'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', Georgia, serif"
        font-size="52" font-weight="700"
        fill="#FEFCF8"
        text-anchor="middle">築</text>
  <!-- Gold accent line -->
  <line x1="30" y1="77" x2="70" y2="77" stroke="#D4AF37" stroke-width="1.2"/>
</svg>
